name: Build and Deploy ARM64

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: ./web
      - run: npm run build
        working-directory: ./web

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: GOOS=linux GOARCH=arm64 go build -o AniaBot_arm64 ./cmd/

      - name: Upload binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "AniaBot_arm64"
          target: "/home/azureuser/"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod +x /home/azureuser/AniaBot_arm64
            docker cp /home/azureuser/AniaBot_arm64 aniabot:/app/aniabot/AniaBot
            docker restart aniabot